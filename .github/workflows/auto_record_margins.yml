name: auto-record-margins

# תיעוד אוטומטי של המלצות המרווח ל-margin_recommendations (מנגנון המרווח, שלב 5א).
# מריץ scripts/auto_record_margins.py פעם ביום מסחר. idempotent: מניעת כפילויות דרך
# margin_recommendation_logged_today מבטיחה שכל פקיעה נרשמת פעם אחת ביום, גם בהרצות חוזרות.

on:
  schedule:
    # פעם ביום, ראשון–חמישי (ימי מסחר בישראל; cron DOW: 0=ראשון ... 4=חמישי).
    # GitHub cron הוא UTC וללא DST. ישראל היא UTC+2 (חורף) / UTC+3 (קיץ):
    #   09:00 UTC  =  11:00 בחורף  /  12:00 בקיץ
    # כך ההרצה נופלת סביב 12:00 שעון ישראל — מאוחר מ-auto_record_decisions (07:00 UTC),
    # כדי לתפוס גם פקיעות שנכנסות ל-chain מאוחר יותר ביום. יום שני (DOW=1) כלול, ולכן
    # מכוסה גם "יום שני בצהריים" שביקשנו — לצד תיעוד יומי מלא (הדדופ מונע כפילויות).
    - cron: '0 9 * * 0-4'
  workflow_dispatch: {}   # מאפשר גם הרצה ידנית מטאב Actions

jobs:
  record-margins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Record margin recommendations
        env:
          # אותו secret שכבר מוגדר ל-Actions הקודמים — אין צורך להגדיר מחדש.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # גשר 3 — kill-switch למסחר-לפי-המלצות (פתיחת עסקאות דמו אוטומטית).
          #
          # ⛔ כובה ב-27/07/2026 בעקבות אירוע תשעה באב (23/07). הסיבה:
          #    ההגנות הקיימות (דדופ, min_days_to_expiry, דמו-בלבד) אינן מגינות מפני
          #    פתיחת עסקה על **שרשרת ישנה** או על יום שהבורסה סגורה — בדיוק מה שקרה.
          #    בנוסף, hold_probability מחושב על סדרת תנועות שנמצאת כרגע בבדיקה
          #    (abs_move_pct מול |move_pct| — פער של פי 2.6 בממוצע).
          #    paper_trades הוא append-only: כל עסקה שנפתחת עכשיו היא נזק בלתי-הפיך.
          #
          # להדלקה מחדש: רק אחרי שער-טריות + לוח מסחר + סגירת שאלת ה-hold.
          RECO_TRADING_ENABLED: "false"
        run: python scripts/auto_record_margins.py
