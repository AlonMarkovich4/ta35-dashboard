name: auto-record-margins

# תיעוד אוטומטי של המלצות המרווח ל-margin_recommendations (מנגנון המרווח, שלב 5א).
# מריץ scripts/auto_record_margins.py פעם ביום מסחר. idempotent: מניעת כפילויות דרך
# margin_recommendation_logged_today מבטיחה שכל פקיעה נרשמת פעם אחת ביום, גם בהרצות חוזרות.

on:
  schedule:
    # פעם ביום, שני–שישי (cron DOW: 1=שני ... 5=שישי).
    #
    # ⚠️ תוקן ב-31/07/2026 מ-'0-4' (ראשון–חמישי). TASE עברה לשבוע מסחר שני–שישי
    #    בתחילת 2026, ולכן הישן רץ בימי ראשון (בלי דאטה טרי) ודילג על שישי —
    #    יום מסחר מלא עם פקיעות. אומת משני מקורות: expiry_history (אפס פקיעות
    #    ביום ראשון ב-2026) ו-Yahoo TA35.TA (אפס ימי ראשון עם מסחר).
    #
    # GitHub cron הוא UTC וללא DST. ישראל היא UTC+2 (חורף) / UTC+3 (קיץ):
    #   09:00 UTC  =  11:00 בחורף  /  12:00 בקיץ
    # כך ההרצה נופלת סביב 12:00 שעון ישראל — מאוחר מ-auto_record_decisions (07:00 UTC),
    # כדי לתפוס גם פקיעות שנכנסות ל-chain מאוחר יותר ביום.
    #
    # ה-cron הוא אופטימיזציה בלבד: _trading_day_guard בסקריפט חוסם חגים, ולכן גם
    # אם ה-DOW יהיה שגוי שוב — לא ייכתב זיוף.
    - cron: '0 9 * * 1-5'
  workflow_dispatch: {}   # מאפשר גם הרצה ידנית מטאב Actions

jobs:
  record-margins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Record margin recommendations
        env:
          # אותו secret שכבר מוגדר ל-Actions הקודמים — אין צורך להגדיר מחדש.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # גשר 3 — kill-switch למסחר-לפי-המלצות (פתיחת עסקאות דמו אוטומטית).
          #
          # ⛔ כובה ב-27/07/2026 בעקבות אירוע תשעה באב (23/07): ההגנות שהיו אז
          #    (דדופ, min_days_to_expiry, דמו-בלבד) לא מנעו פתיחה על **שרשרת
          #    ישנה** או ביום שהבורסה סגורה.
          #
          # ✅ הודלק מחדש 11/08/2026. שני התנאים שנרשמו להדלקה התקיימו, ואומתו
          #    בקוד לפני ההדלקה — לא לפי זיכרון:
          #      1. לוח מסחר — `_trading_day_guard` (auto_record_margins.py:103)
          #         חוסם את כל הריצה ביום שאינו יום מסחר.
          #      2. שער טריות — `is_chain_fresh(fetch_date, today)` נבדק **לכל
          #         פקיעה בנפרד** (margin_recorder.py:212), עם ברירת מחדל
          #         0 = "נמשכה היום". שרשרת ישנה ⇒ status='stale_chain'.
          #    והחוליה שסוגרת: `_open_reco_trades` פותח **רק** לפקיעות בסטטוס
          #    ('recorded', 'skipped_exists'). 'stale_chain' אינו ברשימה, ולכן
          #    שרשרת ישנה אינה מגיעה לפתיחה כלל. זה מצב הכשל המקורי, והוא חסום.
          #
          #    ⚠️ מה ש**לא** נסגר: שאלת ה-hold. hold_probability עדיין נמדד על
          #    תנועת מושב אחד בעוד שהפוזיציה חשופה 5 (HANDOFF 7), והמנוע בוחר
          #    1.75% שם ש-2.5% פחות גרוע (HANDOFF 11). התיק פתוח בכוונה למרות
          #    זאת: הוא **תיק דמו למחקר**, וההשוואה שלו לתיק 9 (תמחור VWAP) על
          #    אותן פקיעות היא כל מטרתו. תיק שלא סוחר אינו מייצר את הנתון הזה.
          RECO_TRADING_ENABLED: "true"
        run: python scripts/auto_record_margins.py
