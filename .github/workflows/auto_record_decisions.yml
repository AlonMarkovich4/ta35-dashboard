name: auto-record-decisions

# תיעוד אוטומטי של החלטות המנוע ל-decision_log (shadow mode).
# מריץ scripts/auto_record_decisions.py פעם ביום מסחר. idempotent: מניעת כפילויות
# דרך decision_logged_today מבטיחה שכל פקיעה נרשמת פעם אחת ביום, גם בהרצות חוזרות.

on:
  schedule:
    # פעם ביום, שני–שישי (cron DOW: 1=שני ... 5=שישי).
    #
    # ⚠️ תוקן ב-31/07/2026 מ-'0-4' (ראשון–חמישי). TASE עברה לשבוע מסחר שני–שישי
    #    בתחילת 2026; הישן רץ בימי ראשון בלי דאטה טרי ודילג על שישי — יום מסחר
    #    מלא עם פקיעות. אומת מ-expiry_history ומ-Yahoo TA35.TA.
    #
    # GitHub cron הוא UTC וללא DST. ישראל היא UTC+2 (חורף) / UTC+3 (קיץ):
    #   07:00 UTC  =  09:00 בחורף  /  10:00 בקיץ
    # כך ההרצה תמיד נופלת בחלון ~09:00–12:00 שעון ישראל, בבוקר לפני שהפקיעות היומיות פוקעות.
    #
    # ה-cron הוא אופטימיזציה בלבד: _trading_day_guard בסקריפט חוסם חגים.
    - cron: '0 7 * * 1-5'
  workflow_dispatch: {}   # מאפשר גם הרצה ידנית מטאב Actions

jobs:
  record-decisions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Record engine decisions
        env:
          # אותו secret שכבר מוגדר ל-auto_close — אין צורך להגדיר מחדש.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/auto_record_decisions.py
