name: auto-record-decisions

# תיעוד אוטומטי של החלטות המנוע ל-decision_log (shadow mode).
# מריץ scripts/auto_record_decisions.py פעם ביום מסחר. idempotent: מניעת כפילויות
# דרך decision_logged_today מבטיחה שכל פקיעה נרשמת פעם אחת ביום, גם בהרצות חוזרות.

on:
  # ⛔ ה-cron הוסר 31/08/2026 — השלבים רצים מ-auto_trade_daily.yml,
  #    כדי שכולם ייצאו מאותו snapshot ובטריגר מתוזמן אחד.
  #    ההרצה הידנית נשארה.
  workflow_dispatch: {}   # מאפשר גם הרצה ידנית מטאב Actions

jobs:
  record-decisions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Record engine decisions
        env:
          # אותו secret שכבר מוגדר ל-auto_close — אין צורך להגדיר מחדש.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/auto_record_decisions.py
