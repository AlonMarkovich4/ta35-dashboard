databases:
  - name: ta35-db
    databaseName: ta35
    user: ta35

services:
  # ── דשבורד Next.js ────────────────────────────────────────────────
  - type: web
    name: ta35-dashboard
    runtime: node
    buildCommand: cd web && npm ci && npm run build
    startCommand: cd web && npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_VERSION
        value: "20"

  # ── Webhook receiver (Telegram → DB) ─────────────────────────────
  - type: web
    name: ta35-webhook
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/webhook_worker.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ta35-db
          property: connectionString
      - key: WEBHOOK_SECRET
        sync: false   # הגדר ידנית ב-Render dashboard
